services:
  - type: web
    name: docintel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: none
      - key: OCR_ENABLED
        value: "true"
      - key: MAX_PAGES
        value: "3"
      - key: MAX_FILE_SIZE_MB
        value: "15"
